          <div class="detail-block"><div class="detail-label">Positional diff</div><div class="detail-value">${formatPercent(fn.positionalDiffPercent ?? fn.diffPercent ?? 0, 4)} · ${formatNumber(fn.positionalDiffBytes ?? fn.diffBytes ?? 0)} / ${formatNumber(fn.positionalDiffSpans ?? fn.diffSpans ?? 0)} spans</div></div>
          <div class="detail-block"><div class="detail-label">Edit ins/del/repl</div><div class="detail-value">${formatNumber(fn.editInsertBytes || 0)} / ${formatNumber(fn.editDeleteBytes || 0)} / ${formatNumber(fn.editReplaceBytes || 0)}</div></div>
          <div class="detail-block"><div class="detail-label">First mismatch</div><div class="detail-value">${escapeHtml(fn.firstMismatchOffset || "-")}${fn.likelyShiftedAlignment ? " · shifted" : ""}</div></div>
          <div class="detail-block"><div class="detail-label">Comment lines</div><div class="detail-value">${formatNumber(fn.sourceCommentLines || 0)}</div></div>
          <div class="detail-block"><div class="detail-label">Calling convention</div><div class="detail-value">${escapeHtml(fn.callingConvention || "?")}</div></div>
          <div class="detail-block"><div class="detail-label">Remaining rank</div><div class="detail-value">${fn.isRemaining ? `#${formatNumber(fn.remainingSizeRank || 0)}` : "done"}</div></div>
        </div>
        <div class="actions">${actions.join("")}</div>
        ${notes.length ? `
          <div>
            <div class="section-label">Notes</div>
            <div class="mini-list">
              ${notes.map(([label, value]) => `<div class="mini-row"><div class="note-label">${escapeHtml(label)}</div><div>${escapeHtml(value)}</div></div>`).join("")}
            </div>
          </div>` : ""}
        <div class="split">
          <div>
            <div class="section-label">Source preview</div>
            <div class="code-path">${escapeHtml(sourcePaths[0] || "No source file in src/")}</div>
            <pre>${escapeHtml(fn.sourcePreview || "No source available for this function yet.")}</pre>
          </div>
          <div>
            <div class="section-label">Paths</div>
            <div class="mini-list">
              <div class="mini-row"><div class="note-label">packet</div><div>${escapeHtml(packetPathForFunction(fn))}</div></div>
              <div class="mini-row"><div class="note-label">source</div><div>${escapeHtml(sourcePaths.join(" | ") || "Unclaimed in src/")}</div></div>
              ${fn.customFlagsPath ? `<div class="mini-row"><div class="note-label">flags</div><div>${escapeHtml(fn.customFlagsPath)}</div></div>` : ""}
            </div>
          </div>
        </div>`;
    }

    function renderDetail() {
      if (!state.selected) {
        renderOverviewDetail();
        return;
      }
      if (state.selected.type === "group") {
        const group = groupByNameVisible(state.selected.name);
        if (!group) {
          state.selected = null;
          renderOverviewDetail();
          return;
        }
        renderGroupDetail(group);
        return;
      }
      const fn = derived.visibleFns.find((entry) => entry.va === state.selected.va);
      if (!fn) {
        state.selected = null;
        renderOverviewDetail();
        return;
      }
      renderFunctionDetail(fn);
    }

    function fitCanvasHeight() {
      const topHeight = elements.top.getBoundingClientRect().height;
      const target = Math.max(460, Math.floor(window.innerHeight - topHeight - 20));
      elements.canvasWrap.style.height = `${target}px`;
    }

    function render() {
      if (!state.liveDrag) {
        saveState();
      }
      derived = deriveData();
      fitCanvasHeight();
      renderTopStats();
      renderControls();
      renderDetail();
      renderTreemap();
    }

    document.addEventListener("click", (event) => {
      const viewNode = event.target.closest("[data-set-view]");
      if (viewNode) {
        state.viewMode = viewNode.getAttribute("data-set-view");
        state.zoomGroup = null;
        state.selected = null;
        render();
        return;
      }

      const metricNode = event.target.closest("[data-set-metric]");
      if (metricNode) {
        state.metric = metricNode.getAttribute("data-set-metric");
        render();
        return;
      }

      const colorNode = event.target.closest("[data-set-color]");
      if (colorNode) {
        state.colorMode = colorNode.getAttribute("data-set-color");
        render();
        return;
      }

      const timelineNode = event.target.closest("[data-set-timeline]");
      if (timelineNode) {
        state.timelineMode = timelineNode.getAttribute("data-set-timeline") === "linear" ? "linear" : "date";
        saveState();
        renderTimeline();
        return;
      }

      const toggleNode = event.target.closest("[data-toggle]");
      if (toggleNode) {
        const key = toggleNode.getAttribute("data-toggle");
        state[key] = !state[key];
        render();
        return;
      }

      const bucketNode = event.target.closest("[data-bucket-toggle]");
      if (bucketNode) {
        const bucket = bucketNode.getAttribute("data-bucket-toggle");
        state.buckets[bucket] = !state.buckets[bucket];
        if (!Object.values(state.buckets).some(Boolean)) {
          state.buckets[bucket] = true;
        }
        render();
        return;
      }

      const actionNode = event.target.closest("[data-action]");
      if (actionNode) {
        const action = actionNode.getAttribute("data-action");
        if (action === "zoom-out") {
          state.zoomGroup = null;
          state.selected = null;
          render();
          return;
        }
        if (action === "reset") {
          state.query = "";
          state.viewMode = "files";
          state.metric = "bytes";
          state.colorMode = "status";
          state.timelineMode = "date";
          state.onlyRemaining = false;
          state.onlyBlockers = false;
          state.buckets = { ...defaultBuckets };
          state.zoomGroup = null;
          state.selected = null;
          render();
          renderTimeline();
          return;
        }
        if (action === "timeline-latest") {
          if (!HISTORY || !HISTORY.commits.length) return;
          dragPending = null;
          state.liveDrag = false;
          installTimeline(HISTORY.commits.length - 1);
          render();
          return;
        }
      }

      const groupNode = event.target.closest("[data-select-group]");
      if (groupNode) {
        const name = groupNode.getAttribute("data-select-group");
        state.selected = { type: "group", name };
        render();
        return;
      }

      const zoomGroupNode = event.target.closest("[data-zoom-group]");
      if (zoomGroupNode) {
        const name = zoomGroupNode.getAttribute("data-zoom-group");
        state.zoomGroup = name;
        state.selected = { type: "group", name };
        render();
        return;
      }

      const fnNode = event.target.closest("[data-select-va]");
      if (fnNode) {
        const va = fnNode.getAttribute("data-select-va");
        state.selected = { type: "function", va };
        render();
        return;
      }

      const focusNode = event.target.closest("[data-focus-function]");
      if (focusNode) {
        const va = focusNode.getAttribute("data-focus-function");
        const fn = FUNCTION_BY_VA.get(va);
        if (fn) {
          state.zoomGroup = fn.groupName;
          state.selected = { type: "function", va };
          render();
        }
      }
    });

    elements.searchInput.addEventListener("input", (event) => {
      state.query = event.target.value;
      render();
    });

    document.getElementById("timeline-slider").addEventListener("input", (event) => {
      const position = Number(event.target.value) / TIMELINE_SCALE_MAX;
      dragPending = commitAtTimelinePosition(position);
      renderTimeline(dragPending);
      scheduleDragTick();
    });

    document.getElementById("timeline-slider").addEventListener("change", (event) => {
      const position = Number(event.target.value) / TIMELINE_SCALE_MAX;
      const target = commitAtTimelinePosition(position);
      dragPending = null;
      state.liveDrag = false;
      installTimeline(target);
      render();
    });

    document.getElementById("timeline-slider").addEventListener("keydown", (event) => {
      if (!HISTORY || !["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
      event.preventDefault();
      let target = timelineIndex;
      if (event.key === "ArrowLeft") target -= 1;
      if (event.key === "ArrowRight") target += 1;
      if (event.key === "Home") target = 0;
      if (event.key === "End") target = HISTORY.commits.length - 1;
      dragPending = null;
      state.liveDrag = false;
      installTimeline(clamp(target, 0, HISTORY.commits.length - 1));
      render();
    });

    function schedulePointerUpdate(pointer) {
      queuedPointer = pointer;
      if (hoverFramePending) {
        return;
      }
      hoverFramePending = true;
      requestAnimationFrame(() => {
        hoverFramePending = false;
        if (!queuedPointer) {
          return;
        }
        const region = hitRegionAt(queuedPointer.x, queuedPointer.y);
        if (region !== hoveredRegion) {
          updateTooltip(queuedPointer.event, region);
          renderHoverOverlay();
        } else if (region) {
          updateTooltip(queuedPointer.event, region);
        }
      });
    }

    elements.canvas.addEventListener("mousemove", (event) => {
      schedulePointerUpdate({ x: event.offsetX, y: event.offsetY, event });
    });

    elements.canvas.addEventListener("mouseleave", () => {
      queuedPointer = null;
      hoveredRegion = null;
      elements.tooltip.classList.remove("visible");
      renderHoverOverlay();
    });

    elements.canvas.addEventListener("click", (event) => {
      const rect = elements.canvas.getBoundingClientRect();
      const region = hitRegionAt(event.clientX - rect.left, event.clientY - rect.top);
      if (!region) {
        state.selected = null;
        render();
        return;
      }

      if (!state.zoomGroup && state.viewMode === "files") {
        state.zoomGroup = region.action.group;
        state.selected = { type: "group", name: region.action.group };
        render();
        return;
      }

      if (region.action.type === "select-function") {
        state.selected = { type: "function", va: region.action.va };
        render();
      }
    });

    elements.canvas.addEventListener("contextmenu", (event) => {
      event.preventDefault();
      if (state.zoomGroup) {
        state.zoomGroup = null;
        state.selected = null;
        render();
      }
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && state.zoomGroup) {
        state.zoomGroup = null;
        state.selected = null;
        render();
      }
    });

    window.addEventListener("resize", () => {
      fitCanvasHeight();
      renderTreemap();
      renderTimeline();
    });

    if (HISTORY && HISTORY.commits.length) {
      installTimeline(HISTORY.commits.length - 1);
    }
    renderTimeline();
    render();
  </script>
</body>
</html>
