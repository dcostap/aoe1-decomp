<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aoe1 status treemap</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090d;
      --bg-2: #0b0e14;
      --text: #f3f5f8;
      --muted: #9aa4b3;
      --muted-2: #6f7886;
      --line: rgba(255, 255, 255, 0.09);
      --line-2: rgba(255, 255, 255, 0.16);
      --hover: rgba(255, 255, 255, 0.06);
      --accent: #d8dde6;
      --matching: #22c55e;
      --accepted-drift: #f59e0b;
      --scratch: #8b5cf6;
      --unclaimed: #475569;
      --conflict: #ef4444;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 12% 0%, rgba(255,255,255,0.05), transparent 18%),
        radial-gradient(circle at 82% 5%, rgba(139,92,246,0.14), transparent 20%),
        linear-gradient(180deg, #090b10 0%, #06080c 100%);
      color: var(--text);
      font-family: var(--sans);
    }

    body {
      padding: 14px;
    }

    .top {
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: baseline;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .generated,
    .stat-item,
    .chip,
    .tiny,
    .button,
    .search input,
    .code-path,
    .note-label,
    .mono,
    .crumb,
    .tooltip-sub,
    .tooltip-note,
    pre,
    code {
      font-family: var(--mono);
    }

    .generated,
    .tiny,
    .tooltip-sub,
    .tooltip-note,
    .detail-note,
    .empty-state,
    .list-meta,
    .note-label,
    .crumb,
    .inline-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .stats-row,
    .controls-row,
    .bucket-row,
    .controls-groups,
    .detail-meta,
    .detail-tags,
    .actions,
    .function-list,
    .crumbs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
    }

    .controls-groups {
      gap: 10px 40px;
    }

    .group-frame {
      padding: 3px 5px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      background: rgba(255,255,255,0.025);
    }

    .stat-item {
      color: var(--text);
      font-size: 12px;
      line-height: 1.45;
      white-space: nowrap;
    }

    .stat-item strong {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .stat-item .label {
      color: var(--muted-2);
      margin-right: 6px;
      text-transform: lowercase;
    }

    .controls {
      display: grid;
      gap: 8px;
      margin-top: 2px;
    }

    .search {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
    }

    .search input {
      width: min(420px, 62vw);
      max-width: 100%;
      min-width: 160px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 12px;
    }

    .search input::placeholder { color: var(--muted-2); }

    .button,
    .chip,
    .crumb {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 12px;
      color: var(--text);
      background: rgba(255,255,255,0.04);
      border: 0;
      cursor: pointer;
      transition: background 110ms ease, transform 110ms ease;
    }

    .chip,
    .crumb.static {
      cursor: default;
    }

    .button:hover,
    .crumb[data-action]:hover,
    .function-link:hover,
    .mini-row:hover {
      background: rgba(255,255,255,0.09);
      transform: translateY(-1px);
    }

    .button.active,
    .chip.active,
    .crumb.active,
    .function-link.active,
    .mini-row.active {
      background: rgba(255,255,255,0.14);
    }

    .button.inactive {
      opacity: 0.45;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .map-shell {
      position: relative;
    }

    .canvas-wrap {
      position: relative;
      min-height: 460px;
      height: calc(100vh - 180px);
      background: #07090d;
      overflow: hidden;
      border-radius: 12px;
    }

    #treemap,
    #treemap-overlay {
      width: 100%;
      height: 100%;
      display: block;
    }

    #treemap {
      cursor: crosshair;
    }

    #treemap-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .empty-state {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      background: rgba(7,9,13,0.84);
    }

    .empty-state.visible {
      display: flex;
    }

    .tooltip {
      position: absolute;
      display: none;
      max-width: 340px;
      padding: 10px 12px;
      background: rgba(5, 7, 10, 0.95);
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
      border-radius: 10px;
      z-index: 3;
      pointer-events: none;
    }

    .tooltip.visible {
      display: block;
    }

    .tooltip-title {
      font-size: 13px;
      line-height: 1.35;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .details {
      margin-top: 18px;
      padding-top: 6px;
      display: grid;
      gap: 12px;
    }

    .detail-title-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      align-items: baseline;
    }

    .detail-title {
      font-size: 24px;
      line-height: 1.05;
      letter-spacing: -0.03em;
      font-weight: 800;
      margin: 0;
    }

    .detail-subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px 16px;
    }

    .detail-block {
      min-width: 0;
    }

    .detail-label {
      color: var(--muted-2);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 3px;
      font-family: var(--mono);
    }

    .detail-value {
      font-size: 16px;
      line-height: 1.35;
      word-break: break-word;
    }

    .detail-tags {
      gap: 8px;
    }

    .section-label {
      color: var(--muted-2);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-family: var(--mono);
      margin: 6px 0 0;
    }

    .mini-list {
      display: grid;
      gap: 8px;
    }

    .mini-row,
    .function-link {
      display: block;
      padding: 8px 10px;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
      transition: background 110ms ease, transform 110ms ease;
      cursor: pointer;
    }

    .mini-title {
      font-size: 13px;
      line-height: 1.35;
      font-weight: 700;
    }

    .list-meta { margin-top: 2px; }

    pre {
      margin: 0;
      padding: 14px;
      background: rgba(255,255,255,0.035);
      border-radius: 12px;
      color: #ebeff5;
      font-size: 12px;
      line-height: 1.55;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
      gap: 16px;
      align-items: start;
    }

    .code-path {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .legend-scale {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-family: var(--mono);
    }

    .gradient {
      width: 120px;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ef4444 0%, #f59e0b 50%, #22c55e 100%);
    }

    .gradient.complexity {
      background: linear-gradient(90deg, #2563eb 0%, #ff0000 100%);
    }

    @media (max-width: 1100px) {
      .detail-grid,
      .split {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 820px) {
      body { padding: 10px; }
      .canvas-wrap { min-height: 420px; }
      .detail-grid,
      .split {
        grid-template-columns: 1fr;
      }
      .search input {
        width: min(100%, 320px);
      }
    }
  </style>
</head>
<body>
  <header class="top" id="top">
    <div class="title-row">
      <h1>aoe1 status treemap</h1>
      <div class="generated" id="generated"></div>
    </div>
    <div class="stats-row" id="stats-primary"></div>
    <div class="stats-row" id="stats-secondary"></div>
    <div class="controls">
      <div class="controls-groups">
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <input id="search-input" type="search" placeholder="function, VA, file, blocker, note...">
        </label>
        <div class="controls-row group-frame" id="view-controls"></div>
        <div class="controls-row group-frame" id="metric-controls"></div>
        <div class="controls-row group-frame" id="color-controls"></div>
        <div class="controls-row group-frame" id="filter-controls"></div>
      </div>
      <div class="bucket-row group-frame" id="bucket-controls"></div>
    </div>
  </header>

  <section class="map-shell">
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="treemap"></canvas>
      <canvas id="treemap-overlay"></canvas>
      <div class="empty-state" id="empty-state"></div>
      <div class="tooltip" id="tooltip"></div>
    </div>
  </section>

  <section class="details" id="details">
    <div class="section-label">Selection details</div>
    <div id="detail-content"></div>
  </section>

  <script>
    const DATA = __DASHBOARD_DATA__;
    const SUMMARY = DATA.summary || {};
    const BUCKET_ORDER = SUMMARY.bucketOrder || ["matching", "accepted_drift", "scratch", "unclaimed", "conflict"];
    const BUCKET_COLORS = SUMMARY.bucketColors || {
      matching: "#22c55e",
      accepted_drift: "#f59e0b",
      scratch: "#8b5cf6",
      unclaimed: "#475569",
      conflict: "#ef4444",
    };
    const STORAGE_KEY = "aoe1-status-treemap-v5";

    const groups = (DATA.groups || []).map((group) => {
      const copy = { ...group };
      copy.children = (group.children || []).map((fn) => ({
        ...fn,
        groupName: group.name,
        groupPath: group.path || "",
      }));
      return copy;
    });

    const GROUP_BY_NAME = new Map(groups.map((group) => [group.name, group]));
    const FUNCTIONS = groups.flatMap((group) => group.children);
    const FUNCTION_BY_VA = new Map(FUNCTIONS.map((fn) => [fn.va, fn]));

    const elements = {
      top: document.getElementById("top"),
      generated: document.getElementById("generated"),
      statsPrimary: document.getElementById("stats-primary"),
      statsSecondary: document.getElementById("stats-secondary"),
      searchInput: document.getElementById("search-input"),
      viewControls: document.getElementById("view-controls"),
      metricControls: document.getElementById("metric-controls"),
      colorControls: document.getElementById("color-controls"),
      filterControls: document.getElementById("filter-controls"),
      bucketControls: document.getElementById("bucket-controls"),
      canvasWrap: document.getElementById("canvas-wrap"),
      canvas: document.getElementById("treemap"),
      overlayCanvas: document.getElementById("treemap-overlay"),
      emptyState: document.getElementById("empty-state"),
      tooltip: document.getElementById("tooltip"),
      detailContent: document.getElementById("detail-content"),
    };

    const defaultBuckets = Object.fromEntries(BUCKET_ORDER.map((bucket) => [bucket, true]));

    function restoreState() {
      let stored = {};
      try {
        stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      } catch (_error) {
        stored = {};
      }
      return {
        query: "",
        viewMode: stored.viewMode || "files",
        metric: stored.metric || "bytes",
        colorMode: stored.colorMode === "attention" ? "complexity" : (stored.colorMode || "status"),
        onlyRemaining: Boolean(stored.onlyRemaining),
        onlyBlockers: Boolean(stored.onlyBlockers),
        buckets: { ...defaultBuckets, ...(stored.buckets || {}) },
        zoomGroup: null,
        selected: null,
      };
    }

    const state = restoreState();
    let derived = null;
    let hitRegions = [];
    let hoveredRegion = null;
    let hoverFramePending = false;
    let queuedPointer = null;

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          viewMode: state.viewMode,
          metric: state.metric,
          colorMode: state.colorMode,
          onlyRemaining: state.onlyRemaining,
          onlyBlockers: state.onlyBlockers,
          buckets: state.buckets,
        }));
      } catch (_error) {
        // ignore storage failures
      }
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function toNumber(value) {
      return Number(value || 0);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;");
    }

    function formatNumber(value) {
      return toNumber(value).toLocaleString("en-US");
    }

    function formatBytes(value) {
      const n = toNumber(value);
      if (n >= 1024 * 1024) {
        return `${(n / (1024 * 1024)).toFixed(2)} MB`;
      }
      if (n >= 1024) {
        return `${(n / 1024).toFixed(n >= 10 * 1024 ? 1 : 2)} KB`;
      }
      return `${formatNumber(n)} B`;
    }

    function formatPercent(value, digits = 1) {
      return `${toNumber(value).toFixed(digits)}%`;
    }

    function repoUrl(relativePath) {
      const normalized = String(relativePath || "").replace(/\\/g, "/");
      if (!normalized) {
        return "";
      }
      return new URL(normalized, window.location.href).href;
    }

    function packetPathForFunction(fn) {
      return `inventory/functions/${fn.va.slice(0, 4)}/${fn.slug}.txt`;
    }

    function sourcePathsForFunction(fn) {
      return String(fn.sourcePath || "")
        .split(" | ")
        .map((part) => part.trim())
        .filter(Boolean);
    }

    function metricValue(item) {
      if (state.metric === "asm") {
        return toNumber(item.asmLines ?? item.valueAsmLines);
      }
      if (state.metric === "count") {
        return Math.max(1, toNumber(item.functionCount ?? 1));
      }
      return toNumber(item.sizeBytes ?? item.valueBytes);
    }

    function metricLabel() {
      if (state.metric === "asm") {
        return "asm";
      }
      if (state.metric === "count") {
        return "count";
      }
      return "bytes";
    }

    function queryTokens() {
      return state.query.trim().toLowerCase().split(/\s+/).filter(Boolean);
    }

    function includesAll(text, tokens) {
      const hay = String(text || "").toLowerCase();
      return tokens.every((token) => hay.includes(token));
    }

    function functionBasePass(fn) {
      if (!state.buckets[fn.bucket]) {
        return false;
      }
      if (state.onlyRemaining && !fn.isRemaining) {
        return false;
      }
      if (state.onlyBlockers && !fn.hasBlocker) {
        return false;
      }
      return true;
    }

    function functionSearchPass(fn, group, tokens) {
      if (!tokens.length) {
        return true;
      }
      const hay = [
        fn.va,
        fn.name,
        group.name,
        group.path || "",
        fn.sourceStatus,
        fn.sourceNote,
        fn.sourceBlocker,
        fn.sourceNext,
        fn.sourceWhy,
        fn.sourceRisk,
      ].join(" ");
      return includesAll(hay, tokens);
    }

    function groupSearchPass(group, tokens) {
      if (!tokens.length) {
        return true;
      }
      return includesAll(`${group.name} ${group.path || ""}`, tokens);
    }

    function aggregateGroup(group, children) {
      const bucketCounts = Object.fromEntries(BUCKET_ORDER.map((bucket) => [bucket, 0]));
      const bucketBytes = Object.fromEntries(BUCKET_ORDER.map((bucket) => [bucket, 0]));
      let valueBytes = 0;
      let valueAsmLines = 0;
      let matchedCount = 0;
      let matchedBytes = 0;
      let remainingCount = 0;
      let remainingBytes = 0;
      let blockerCount = 0;
      let customFlagsCount = 0;
      let diffKnownCount = 0;
      let diffPercentTotal = 0;
      let editDiffPercentTotal = 0;

      for (const fn of children) {
        valueBytes += fn.sizeBytes;
        valueAsmLines += fn.asmLines;
        bucketCounts[fn.bucket] += 1;
        bucketBytes[fn.bucket] += fn.sizeBytes;
        if (fn.bucket === "matching") {
          matchedCount += 1;
          matchedBytes += fn.sizeBytes;
        }
        if (fn.isRemaining) {
          remainingCount += 1;
          remainingBytes += fn.sizeBytes;
        }
        if (fn.hasBlocker) {
          blockerCount += 1;
        }
        if (fn.usesCustomFlags) {
          customFlagsCount += 1;
        }
        if (fn.diffResult) {
          diffKnownCount += 1;
          diffPercentTotal += toNumber(fn.positionalDiffPercent ?? fn.diffPercent);
          editDiffPercentTotal += toNumber(fn.editDiffPercent ?? fn.diffPercent);
        }
      }

      const dominantBucket = BUCKET_ORDER.slice().sort((a, b) => (
        bucketCounts[b] - bucketCounts[a] || bucketBytes[b] - bucketBytes[a]
      ))[0] || "unclaimed";

      return {
        type: "group",
        name: group.name,
        path: group.path || "",
        childrenVisible: children.slice().sort((a, b) => b.sizeBytes - a.sizeBytes || b.asmLines - a.asmLines || a.va.localeCompare(b.va)),
        functionCount: children.length,
        valueBytes,
        valueAsmLines,
        matchedCount,
        matchedBytes,
        remainingCount,
        remainingBytes,
        blockerCount,
        customFlagsCount,
        diffKnownCount,
        avgDiffPercent: diffKnownCount ? diffPercentTotal / diffKnownCount : 0,
        avgEditDiffPercent: diffKnownCount ? editDiffPercentTotal / diffKnownCount : 0,
        bucketCounts,
        bucketBytes,
        progressFunctions: children.length ? (matchedCount / children.length) * 100 : 0,
        progressBytes: valueBytes ? (matchedBytes / valueBytes) * 100 : 0,
        dominantBucket,
      };
    }

    function deriveData() {
      const tokens = queryTokens();
      const visibleGroups = [];
      const visibleFns = [];

      for (const group of groups) {
        const groupMatched = tokens.length ? groupSearchPass(group, tokens) : false;
        const children = group.children.filter((fn) => {
          if (!functionBasePass(fn)) {
            return false;
          }
          return !tokens.length || groupMatched || functionSearchPass(fn, group, tokens);
        });
        if (!children.length) {
          continue;
        }
        const aggregate = aggregateGroup(group, children);
        visibleGroups.push(aggregate);
        visibleFns.push(...children);
      }

      visibleGroups.sort((a, b) => metricValue(b) - metricValue(a) || b.remainingBytes - a.remainingBytes || a.name.localeCompare(b.name));
      visibleFns.sort((a, b) => {
        const aScore = (a.hasBlocker ? 1 : 0) + (a.bucket === "unclaimed" ? 0.4 : 0) + (a.bucket === "scratch" ? 0.2 : 0);
        const bScore = (b.hasBlocker ? 1 : 0) + (b.bucket === "unclaimed" ? 0.4 : 0) + (b.bucket === "scratch" ? 0.2 : 0);
        return bScore - aScore || b.sizeBytes - a.sizeBytes || b.asmLines - a.asmLines || a.va.localeCompare(b.va);
      });

      const stats = {
        files: visibleGroups.length,
        functions: visibleFns.length,
        bytes: 0,
        asmLines: 0,
        matchedFunctions: 0,
        matchedBytes: 0,
        remainingFunctions: 0,
        remainingBytes: 0,
        blockers: 0,
        customFlags: 0,
        bucketCounts: Object.fromEntries(BUCKET_ORDER.map((bucket) => [bucket, 0])),
        bucketBytes: Object.fromEntries(BUCKET_ORDER.map((bucket) => [bucket, 0])),
      };

      for (const fn of visibleFns) {
        stats.bytes += fn.sizeBytes;
        stats.asmLines += fn.asmLines;
        stats.bucketCounts[fn.bucket] += 1;
        stats.bucketBytes[fn.bucket] += fn.sizeBytes;
        if (fn.bucket === "matching") {
          stats.matchedFunctions += 1;
          stats.matchedBytes += fn.sizeBytes;
        }
        if (fn.isRemaining) {
          stats.remainingFunctions += 1;
          stats.remainingBytes += fn.sizeBytes;
        }
        if (fn.hasBlocker) {
          stats.blockers += 1;
        }
        if (fn.usesCustomFlags) {
          stats.customFlags += 1;
        }
      }

      if (state.selected && state.selected.type === "group" && !visibleGroups.some((group) => group.name === state.selected.name)) {
        state.selected = null;
      }
      if (state.selected && state.selected.type === "function" && !visibleFns.some((fn) => fn.va === state.selected.va)) {
        state.selected = null;
      }
      if (state.zoomGroup && !visibleGroups.some((group) => group.name === state.zoomGroup)) {
        state.zoomGroup = null;
      }

      return {
        visibleGroups,
        visibleFns,
        stats,
        zoomGroup: state.zoomGroup ? visibleGroups.find((group) => group.name === state.zoomGroup) || null : null,
      };
    }

    function normalizeTreemapItems(items, rect) {
      const total = items.reduce((sum, item) => sum + item.value, 0);
      const area = rect.width * rect.height;
      if (total <= 0 || area <= 0) {
        return [];
      }
      return items
        .filter((item) => item.value > 0)
        .map((item) => ({ item, area: (item.value / total) * area }))
        .sort((a, b) => b.item.value - a.item.value || String(a.item.id).localeCompare(String(b.item.id)));
    }

    function worstRatio(row, shortSide) {
      if (!row.length || shortSide <= 0) {
        return Number.POSITIVE_INFINITY;
      }
      const areas = row.map((entry) => entry.area);
      const sum = areas.reduce((total, value) => total + value, 0);
      const max = Math.max(...areas);
      const min = Math.min(...areas);
      if (min <= 0 || sum <= 0) {
        return Number.POSITIVE_INFINITY;
      }
      const sideSquared = shortSide * shortSide;
      return Math.max((sideSquared * max) / (sum * sum), (sum * sum) / (sideSquared * min));
    }

    function placeTreemapRow(row, rect) {
      const rowArea = row.reduce((sum, entry) => sum + entry.area, 0);
      const layoutHorizontal = rect.width < rect.height;
      const placed = [];

      if (layoutHorizontal) {
        const rowHeight = rect.width > 0 ? rowArea / rect.width : 0;
        let x = rect.x;
        for (const entry of row) {
          const width = rowHeight > 0 ? entry.area / rowHeight : 0;
          placed.push({ item: entry.item, rect: { x, y: rect.y, width, height: rowHeight } });
          x += width;
        }
        return {
          placed,
          remaining: {
            x: rect.x,
            y: rect.y + rowHeight,
            width: rect.width,
            height: Math.max(rect.height - rowHeight, 0),
          },
        };
      }

      const rowWidth = rect.height > 0 ? rowArea / rect.height : 0;
      let y = rect.y;
      for (const entry of row) {
        const height = rowWidth > 0 ? entry.area / rowWidth : 0;
        placed.push({ item: entry.item, rect: { x: rect.x, y, width: rowWidth, height } });
        y += height;
      }
      return {
        placed,
        remaining: {
          x: rect.x + rowWidth,
          y: rect.y,
          width: Math.max(rect.width - rowWidth, 0),
          height: rect.height,
        },
      };
    }

    function squarify(items, rect) {
      const working = normalizeTreemapItems(items, rect);
      const placements = [];
      let remaining = { ...rect };
      let row = [];

      while (working.length) {
        const candidate = working[0];
        const shortSide = Math.min(remaining.width, remaining.height);
        if (!row.length || worstRatio(row.concat(candidate), shortSide) <= worstRatio(row, shortSide)) {
          row.push(candidate);
          working.shift();
          continue;
        }
        const placed = placeTreemapRow(row, remaining);
        placements.push(...placed.placed);
        remaining = placed.remaining;
        row = [];
      }

      if (row.length) {
        const placed = placeTreemapRow(row, remaining);
        placements.push(...placed.placed);
      }

      return placements;
    }

    function insetRect(rect, padding) {
      return {
        x: rect.x + padding,
        y: rect.y + padding,
        width: Math.max(0, rect.width - padding * 2),
        height: Math.max(0, rect.height - padding * 2),
      };
    }

    function roundedRectPath(ctx, x, y, width, height, radius) {
      const r = Math.max(0, Math.min(radius, width / 2, height / 2));
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
    }

    function fillRoundedRect(ctx, rect, radius, fillStyle, strokeStyle = "", lineWidth = 1) {
      roundedRectPath(ctx, rect.x, rect.y, rect.width, rect.height, radius);
      ctx.fillStyle = fillStyle;
      ctx.fill();
      if (strokeStyle) {
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = strokeStyle;
        ctx.stroke();
      }
    }

    function hexToRgb(hex) {
      const clean = String(hex).replace("#", "").trim();
      const normalized = clean.length === 3 ? clean.split("").map((c) => c + c).join("") : clean;
      const int = parseInt(normalized, 16);
      return {
        r: (int >> 16) & 255,
        g: (int >> 8) & 255,
        b: int & 255,
      };
    }

    function rgbToHex(rgb) {
      return `#${[rgb.r, rgb.g, rgb.b].map((value) => clamp(Math.round(value), 0, 255).toString(16).padStart(2, "0")).join("")}`;
    }

    function mixColor(a, b, t) {
      const c1 = hexToRgb(a);
      const c2 = hexToRgb(b);
      return rgbToHex({
        r: c1.r + (c2.r - c1.r) * t,
        g: c1.g + (c2.g - c1.g) * t,
        b: c1.b + (c2.b - c1.b) * t,
      });
    }

    function triColor(a, b, c, t) {
      return t <= 0.5 ? mixColor(a, b, t * 2) : mixColor(b, c, (t - 0.5) * 2);
    }

    function soften(fill, t = 0.72) {
      return mixColor("#0a0d12", fill, t);
    }

    function diffColor(diffPercent, hasDiff) {
      if (!hasDiff) {
        return "#475569";
      }
      const diff = clamp(toNumber(diffPercent), 0, 25);
      const t = diff / 25;
      return triColor("#22c55e", "#f59e0b", "#ef4444", t);
    }

    function colorForGroup(item) {
      if (state.colorMode === "status") {
        return soften(BUCKET_COLORS[item.dominantBucket] || "#475569", 0.42);
      }
      if (state.colorMode === "progress") {
        return soften(diffColor(item.avgEditDiffPercent ?? item.avgDiffPercent ?? 0, item.diffKnownCount > 0), 0.54);
      }
      const unresolved = item.valueBytes ? item.remainingBytes / item.valueBytes : 0;
      const blocked = item.functionCount ? item.blockerCount / item.functionCount : 0;
      const severity = clamp(unresolved * 0.62 + blocked * 0.38 + (item.bucketCounts.conflict ? 0.2 : 0), 0, 1);
      return soften(triColor("#202736", "#8b5cf6", "#ff8b55", severity), 0.58);
    }

    function groupIsFullyMatched(group) {
      return group.functionCount > 0 && group.remainingCount === 0;
    }

    function groupHeaderFill(group) {
      return groupIsFullyMatched(group)
        ? soften(BUCKET_COLORS.matching || "#22c55e", 0.78)
        : "#2a313d";
    }

    function groupBodyFill(_group) {
      return "#2f3744";
    }

    function colorForFunction(item) {
      if (item.bucket === "matching") {
        return state.colorMode === "complexity" ? "#141820" : BUCKET_COLORS.matching;
      }
      if (state.colorMode === "status") {
        return BUCKET_COLORS[item.bucket] || "#475569";
      }
      if (state.colorMode === "progress") {
        return diffColor(item.editDiffPercent ?? item.diffPercent ?? 0, Boolean(item.diffResult));
      }
      const complexity = clamp((item.sourceCommentLines || 0) / 17, 0, 1);
      return mixColor("#2563eb", "#ff0000", complexity);
    }

    function tileTextColor(fill) {
      const { r, g, b } = hexToRgb(fill);
      const luminance = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
      return luminance > 0.6 ? "#0b0d12" : "#f4f6f9";
    }

    function wrapText(ctx, text, maxWidth, maxLines) {
      const words = String(text || "").split(/\s+/).filter(Boolean);
      if (!words.length) {
        return [];
      }
      const lines = [];
      let current = words[0];
      for (let index = 1; index < words.length; index += 1) {
        const trial = `${current} ${words[index]}`;
        if (ctx.measureText(trial).width <= maxWidth) {
          current = trial;
        } else {
          lines.push(current);
          current = words[index];
          if (lines.length === maxLines - 1) {
            break;
          }
        }
      }
      lines.push(current);
      if (lines.length > maxLines) {
        lines.length = maxLines;
      }
      const original = words.join(" ");
      const rebuilt = lines.join(" ");
      if (rebuilt.length < original.length) {
        lines[lines.length - 1] = `${lines[lines.length - 1].replace(/[.]{0,3}$/, "")}…`;
      }
      return lines;
    }

    function drawStageBackground(ctx, width, height) {
      ctx.clearRect(0, 0, width, height);
      const base = ctx.createLinearGradient(0, 0, 0, height);
      base.addColorStop(0, "#0a0d12");
      base.addColorStop(1, "#07090d");
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, width, height);

      const glowA = ctx.createRadialGradient(width * 0.16, height * 0.08, 0, width * 0.16, height * 0.08, width * 0.5);
      glowA.addColorStop(0, "rgba(255,255,255,0.05)");
      glowA.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = glowA;
      ctx.fillRect(0, 0, width, height);

      const glowB = ctx.createRadialGradient(width * 0.85, height * 0.1, 0, width * 0.85, height * 0.1, width * 0.42);
      glowB.addColorStop(0, "rgba(139,92,246,0.13)");
      glowB.addColorStop(1, "rgba(139,92,246,0)");
      ctx.fillStyle = glowB;
      ctx.fillRect(0, 0, width, height);
    }

    function groupHeaderHeight(rect) {
      if (rect.width < 90 || rect.height < 30) {
        return 0;
      }
      if (rect.height > 82) {
        return Math.min(50, rect.height - 8);
      }
      if (rect.height > 50) {
        return Math.min(36, rect.height - 6);
      }
      return Math.min(24, rect.height - 4);
    }

    function drawGroupLabel(ctx, rect, group, fill) {
      const headerHeight = groupHeaderHeight(rect);
      if (!headerHeight) {
        return 0;
      }
      const headerRect = {
        x: rect.x + 1,
        y: rect.y + 1,
        width: rect.width - 2,
        height: headerHeight,
      };
      const text = tileTextColor(fill);
      const secondary = text === "#0b0d12" ? "rgba(11,13,18,0.72)" : "rgba(255,255,255,0.72)";
      const left = headerRect.x + 8;
      let top = headerRect.y + 15;
      const maxWidth = headerRect.width - 16;

      fillRoundedRect(ctx, headerRect, 7, fill);

      ctx.save();
      roundedRectPath(ctx, headerRect.x, headerRect.y, headerRect.width, headerRect.height, 7);
      ctx.clip();

      ctx.font = '700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
      ctx.fillStyle = text;
      const titleLines = wrapText(ctx, group.name, maxWidth, headerRect.height > 38 ? 2 : 1);
      for (const line of titleLines) {
        ctx.fillText(line, left, top);
        top += 14;
      }

      if (headerRect.height > 30) {
        ctx.font = '12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
        ctx.fillStyle = secondary;
        const meta = `${formatPercent(group.progressBytes, 0)} matched · ${formatNumber(group.functionCount)} fn`;
        ctx.fillText(meta, left, top);
      }

      ctx.restore();
      return headerHeight + 4;
    }

    function drawFunctionLabel(ctx, rect, fn, fill) {
      const area = rect.width * rect.height;
      if (area < 2200 || rect.width < 82 || rect.height < 42) {
        return;
      }
      const text = tileTextColor(fill);
      const secondary = text === "#0b0d12" ? "rgba(11,13,18,0.72)" : "rgba(255,255,255,0.72)";
      const left = rect.x + 8;
      let top = rect.y + 16;
      const maxWidth = rect.width - 16;

      ctx.save();
      roundedRectPath(ctx, rect.x, rect.y, rect.width, rect.height, 6);
      ctx.clip();
      ctx.fillStyle = text;
      ctx.font = '700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
      const titleLines = wrapText(ctx, fn.name, maxWidth, rect.height > 72 ? 2 : 1);
      for (const line of titleLines) {
        ctx.fillText(line, left, top);
        top += 13;
      }
      ctx.fillStyle = secondary;
      ctx.font = '11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
      const meta = `${fn.va} · ${state.metric === "asm" ? `${formatNumber(fn.asmLines)} asm` : formatBytes(fn.sizeBytes)}`;
      if (top + 12 < rect.y + rect.height - 6) {
        ctx.fillText(meta, left, top);
      }
      ctx.restore();
    }

    function selectedKey() {
      if (!state.selected) {
        return "";
      }
      return state.selected.type === "group" ? `group:${state.selected.name}` : `fn:${state.selected.va}`;
    }

    function pushHitRegion(rect, hoverItem, action) {
      hitRegions.push({ rect, hoverItem, action });
    }

    function renderOverviewTreemap(ctx, stageRect) {
      const selected = selectedKey();
      const groupItems = derived.visibleGroups.map((group) => ({ ...group, type: "group", id: `group:${group.name}`, value: metricValue(group) }));
      const groupPlacements = squarify(groupItems, stageRect);

      for (const placement of groupPlacements) {
        const group = placement.item;
        const outer = insetRect(placement.rect, 2);
        const fill = groupBodyFill(group);
        const selectedGroup = selected === group.id;
        const border = selectedGroup ? "rgba(255,255,255,0.94)" : "rgba(255,255,255,0.12)";
        const strokeWidth = selectedGroup ? 2 : 1;

        fillRoundedRect(ctx, outer, 8, fill, border, strokeWidth);

        const sheen = ctx.createLinearGradient(outer.x, outer.y, outer.x, outer.y + outer.height);
        sheen.addColorStop(0, "rgba(255,255,255,0.06)");
        sheen.addColorStop(1, "rgba(255,255,255,0.01)");
        fillRoundedRect(ctx, outer, 8, sheen);

        const labelOffset = drawGroupLabel(ctx, outer, group, groupHeaderFill(group));
        pushHitRegion(outer, group, { type: "zoom-group", group: group.name });

        const childRect = insetRect({
          x: outer.x + 2,
          y: outer.y + labelOffset,
          width: outer.width - 4,
          height: outer.height - labelOffset - 2,
        }, 1);

        if (childRect.width < 8 || childRect.height < 8) {
          continue;
        }

        const childItems = group.childrenVisible.map((fn) => ({ ...fn, type: "function", id: `fn:${fn.va}`, value: metricValue(fn) }));
        const childPlacements = squarify(childItems, childRect);
        for (const childPlacement of childPlacements) {
          const fn = childPlacement.item;
          const fnRect = insetRect(childPlacement.rect, 0.6);
          if (fnRect.width <= 0 || fnRect.height <= 0) {
            continue;
          }
          const fnFill = colorForFunction(fn);
          const selectedFn = selected === fn.id;
          const fnBorder = selectedFn ? "rgba(255,255,255,0.95)" : "rgba(255,255,255,0.04)";
          const fnStroke = selectedFn ? 1.8 : 0.8;
          fillRoundedRect(ctx, fnRect, Math.min(4, fnRect.width / 3, fnRect.height / 3), fnFill, fnBorder, fnStroke);
          pushHitRegion(fnRect, fn, { type: "zoom-group", group: group.name });
        }
      }
    }

    function renderFlatFunctionTreemap(ctx, stageRect, functions, insideZoom) {
      const items = functions.map((fn) => ({ ...fn, type: "function", id: `fn:${fn.va}`, value: metricValue(fn) }));
      const placements = squarify(items, stageRect);
      const selected = selectedKey();

      for (const placement of placements) {
        const fn = placement.item;
        const rect = insetRect(placement.rect, 1.2);
        const fill = colorForFunction(fn);
        const selectedFn = selected === fn.id;
        const border = selectedFn ? "rgba(255,255,255,0.95)" : "rgba(255,255,255,0.08)";
        const strokeWidth = selectedFn ? 2 : 1;

        fillRoundedRect(ctx, rect, 6, fill, border, strokeWidth);
        const sheen = ctx.createLinearGradient(rect.x, rect.y, rect.x, rect.y + rect.height);
        sheen.addColorStop(0, "rgba(255,255,255,0.07)");
        sheen.addColorStop(1, "rgba(255,255,255,0.01)");
        fillRoundedRect(ctx, rect, 6, sheen);
        drawFunctionLabel(ctx, rect, fn, fill);
        pushHitRegion(rect, fn, { type: "select-function", va: fn.va, group: fn.groupName, insideZoom });
      }
    }

    function syncCanvasSize(canvas, width, height, dpr) {
      const targetWidth = Math.floor(width * dpr);
      const targetHeight = Math.floor(height * dpr);
      if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
        canvas.width = targetWidth;
        canvas.height = targetHeight;
      }
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return ctx;
    }

    function renderHoverOverlay() {
      const dpr = window.devicePixelRatio || 1;
      const bounds = elements.canvasWrap.getBoundingClientRect();
      const width = Math.max(1, Math.floor(bounds.width));
      const height = Math.max(1, Math.floor(bounds.height));
      const ctx = syncCanvasSize(elements.overlayCanvas, width, height, dpr);
      ctx.clearRect(0, 0, width, height);

      if (!hoveredRegion) {
        return;
      }

      const rect = hoveredRegion.rect;
      const item = hoveredRegion.hoverItem;
      const radius = item.type === "group" ? 8 : 6;
      roundedRectPath(ctx, rect.x, rect.y, rect.width, rect.height, radius);
      ctx.lineWidth = item.type === "group" ? 2 : 1.5;
      ctx.strokeStyle = "rgba(255,255,255,0.92)";
      ctx.stroke();
    }

    function renderTreemap() {
      const dpr = window.devicePixelRatio || 1;
      const bounds = elements.canvasWrap.getBoundingClientRect();
      const width = Math.max(1, Math.floor(bounds.width));
      const height = Math.max(1, Math.floor(bounds.height));
      const ctx = syncCanvasSize(elements.canvas, width, height, dpr);
      syncCanvasSize(elements.overlayCanvas, width, height, dpr);
      drawStageBackground(ctx, width, height);
      hitRegions = [];

      const stageRect = { x: 4, y: 4, width: width - 8, height: height - 8 };

      if (derived.zoomGroup) {
        if (!derived.zoomGroup.childrenVisible.length) {
          elements.emptyState.classList.add("visible");
          elements.emptyState.innerHTML = "<div><strong>No visible functions</strong><div>Relax the current filters.</div></div>";
          renderHoverOverlay();
          return;
        }
        elements.emptyState.classList.remove("visible");
        renderFlatFunctionTreemap(ctx, stageRect, derived.zoomGroup.childrenVisible, true);
        renderHoverOverlay();
        return;
      }

      if (state.viewMode === "functions") {
        if (!derived.visibleFns.length) {
          elements.emptyState.classList.add("visible");
          elements.emptyState.innerHTML = "<div><strong>No visible functions</strong><div>Relax the current filters.</div></div>";
          renderHoverOverlay();
          return;
        }
        elements.emptyState.classList.remove("visible");
        renderFlatFunctionTreemap(ctx, stageRect, derived.visibleFns, false);
        renderHoverOverlay();
        return;
      }

      if (!derived.visibleGroups.length) {
        elements.emptyState.classList.add("visible");
        elements.emptyState.innerHTML = "<div><strong>No visible files</strong><div>Relax the current filters.</div></div>";
        renderHoverOverlay();
        return;
      }
      elements.emptyState.classList.remove("visible");
      renderOverviewTreemap(ctx, stageRect);
      renderHoverOverlay();
    }

    function hitRegionAt(x, y) {
      for (let index = hitRegions.length - 1; index >= 0; index -= 1) {
        const region = hitRegions[index];
        if (x >= region.rect.x && x <= region.rect.x + region.rect.width && y >= region.rect.y && y <= region.rect.y + region.rect.height) {
          return region;
        }
      }
      return null;
    }

    function tooltipHtml(item) {
      if (item.type === "group") {
        return `
          <div class="tooltip-title">${escapeHtml(item.name)}</div>
          <div class="tooltip-sub">${formatNumber(item.functionCount)} fn · ${formatPercent(item.progressBytes, 1)} matched bytes · ${formatBytes(item.remainingBytes)} remaining</div>
          <div class="tooltip-note">${escapeHtml(item.path || "(no PDB path)")}</div>`;
      }
      return `
        <div class="tooltip-title"><span class="mono">${escapeHtml(item.va)}</span> ${escapeHtml(item.name)}</div>
        <div class="tooltip-sub">${escapeHtml(item.groupName)} · ${formatBytes(item.sizeBytes)} · ${formatNumber(item.asmLines)} asm · ${escapeHtml(item.bucket)} · edit ${formatPercent(item.editDiffPercent ?? item.diffPercent ?? 0, 4)} · positional ${formatPercent(item.positionalDiffPercent ?? item.diffPercent ?? 0, 4)} · ${formatNumber(item.sourceCommentLines || 0)} comment lines</div>
        ${(item.sourceBlocker || item.sourceNext || item.sourceNote) ? `<div class="tooltip-note">${escapeHtml(item.sourceBlocker || item.sourceNext || item.sourceNote)}</div>` : ""}`;
    }

    function updateTooltip(event, region) {
      hoveredRegion = region;
      if (!region) {
        elements.tooltip.classList.remove("visible");
        return;
      }
      elements.tooltip.innerHTML = tooltipHtml(region.hoverItem);
      elements.tooltip.classList.add("visible");
      const wrapRect = elements.canvasWrap.getBoundingClientRect();
      const x = event.clientX - wrapRect.left + 14;
      const y = event.clientY - wrapRect.top + 14;
      requestAnimationFrame(() => {
        const tipRect = elements.tooltip.getBoundingClientRect();
        const left = clamp(x, 8, wrapRect.width - tipRect.width - 8);
        const top = clamp(y, 8, wrapRect.height - tipRect.height - 8);
        elements.tooltip.style.left = `${left}px`;
        elements.tooltip.style.top = `${top}px`;
      });
    }

    function statHtml(label, value) {
      return `<span class="stat-item"><span class="label">${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></span>`;
    }

    function renderTopStats() {
      elements.generated.textContent = `generated ${DATA.generatedAt}`;

      elements.statsPrimary.innerHTML = [
        statHtml("normal", `${formatNumber(SUMMARY.totalFunctions)} fn`),
        statHtml("matched fn", formatPercent(SUMMARY.progressFunctions, 1)),
        statHtml("matched bytes", formatPercent(SUMMARY.progressBytes, 1)),
        statHtml("remaining", `${formatNumber(SUMMARY.remainingFunctions)} fn`),
        statHtml("accepted drift", `${formatNumber(SUMMARY.bucketCounts?.accepted_drift || 0)} fn`),
        statHtml("scratch", `${formatNumber(SUMMARY.bucketCounts?.scratch || 0)} fn`),
        statHtml("unclaimed", `${formatNumber(SUMMARY.bucketCounts?.unclaimed || 0)} fn`),
        statHtml("conflict", `${formatNumber(SUMMARY.bucketCounts?.conflict || 0)} fn`),
        statHtml("excluded", `${formatNumber(SUMMARY.excludedFunctions || 0)} fn`),
      ].join("");

      const visibleFnProgress = derived.stats.functions ? (derived.stats.matchedFunctions / derived.stats.functions) * 100 : 0;
      const visibleByteProgress = derived.stats.bytes ? (derived.stats.matchedBytes / derived.stats.bytes) * 100 : 0;
      elements.statsSecondary.innerHTML = [
        statHtml("visible files", formatNumber(derived.stats.files)),
        statHtml("visible fn", formatNumber(derived.stats.functions)),
        statHtml("visible matched fn", formatPercent(visibleFnProgress, 1)),
        statHtml("visible matched bytes", formatPercent(visibleByteProgress, 1)),
        statHtml("visible remaining", formatBytes(derived.stats.remainingBytes)),
        statHtml("color", state.colorMode === "progress" ? "edit diff %" : state.colorMode),
        statHtml("blockers", formatNumber(derived.stats.blockers)),
        statHtml("custom flags", formatNumber(derived.stats.customFlags)),
        statHtml("view", derived.zoomGroup ? "zoomed file" : state.viewMode),
      ].join("");
    }

    function renderControls() {
      elements.searchInput.value = state.query;

      elements.viewControls.innerHTML = [
        ["files", "files"],
        ["functions", "functions"],
      ].map(([value, label]) => `<button class="button ${state.viewMode === value && !state.zoomGroup ? "active" : ""}" data-set-view="${value}">${escapeHtml(label)}</button>`).join("");

      elements.metricControls.innerHTML = [
        ["bytes", "bytes"],
        ["asm", "asm"],
        ["count", "count"],
      ].map(([value, label]) => `<button class="button ${state.metric === value ? "active" : ""}" data-set-metric="${value}">${escapeHtml(label)}</button>`).join("");

      elements.colorControls.innerHTML = [
        ["status", "status"],
        ["progress", "progress"],
        ["complexity", "complexity"],
      ].map(([value, label]) => `<button class="button ${state.colorMode === value ? "active" : ""}" data-set-color="${value}">${escapeHtml(label)}</button>`).join("");

      elements.filterControls.innerHTML = [
        `<button class="button ${state.onlyRemaining ? "active" : ""}" data-toggle="onlyRemaining">only remaining</button>`,
        `<button class="button ${state.onlyBlockers ? "active" : ""}" data-toggle="onlyBlockers">only blockers</button>`,
        state.zoomGroup ? `<button class="button active" data-action="zoom-out">zoom out</button>` : "",
        `<button class="button" data-action="reset">reset</button>`,
      ].filter(Boolean).join("");

      elements.bucketControls.innerHTML = BUCKET_ORDER.map((bucket) => {
        const active = Boolean(state.buckets[bucket]);
        const count = derived.stats.bucketCounts[bucket] || 0;
        return `<button class="button ${active ? "active" : "inactive"}" data-bucket-toggle="${bucket}"><span class="dot" style="background:${BUCKET_COLORS[bucket]}"></span>${escapeHtml(bucket)} ${formatNumber(count)}</button>`;
      }).join("");
    }

    function groupByNameVisible(name) {
      return derived.visibleGroups.find((group) => group.name === name) || null;
    }

    function renderOverviewDetail() {
      const topFiles = derived.visibleGroups
        .filter((group) => group.remainingCount > 0)
        .sort((a, b) => b.remainingBytes - a.remainingBytes || b.remainingCount - a.remainingCount || a.name.localeCompare(b.name))
        .slice(0, 8);
      const topFns = derived.visibleFns
        .filter((fn) => fn.isRemaining)
        .slice(0, 10);

      elements.detailContent.innerHTML = `
        <div class="detail-title-row">
          <h2 class="detail-title">overview</h2>
          <div class="detail-subtitle">The main treemap is the dashboard. In the default file overview, each large region is a source file and the small colored tiles inside are individual functions. Click anywhere in a file region to zoom into it.</div>
        </div>
        <div class="split">
          <div>
            <div class="section-label">largest remaining files</div>
            <div class="mini-list">
              ${topFiles.map((group) => `
                <button class="mini-row" data-select-group="${escapeHtml(group.name)}" data-zoom-group="${escapeHtml(group.name)}">
                  <div class="mini-title">${escapeHtml(group.name)}</div>
                  <div class="list-meta">${formatBytes(group.remainingBytes)} remaining · ${formatNumber(group.remainingCount)} fn · ${formatPercent(group.progressBytes, 0)} matched</div>
                </button>
              `).join("") || `<div class="inline-note">No remaining files under the current filters.</div>`}
            </div>
          </div>
          <div>
            <div class="section-label">largest remaining functions</div>
            <div class="mini-list">
              ${topFns.map((fn) => `
                <button class="mini-row" data-select-va="${escapeHtml(fn.va)}" data-focus-function="${escapeHtml(fn.va)}">
                  <div class="mini-title"><span class="mono">${escapeHtml(fn.va)}</span> ${escapeHtml(fn.name)}</div>
                  <div class="list-meta">${escapeHtml(fn.groupName)} · ${formatBytes(fn.sizeBytes)} · ${escapeHtml(fn.bucket)}${fn.sourceBlocker ? ` · ${escapeHtml(fn.sourceBlocker)}` : ""}</div>
                </button>
              `).join("") || `<div class="inline-note">No remaining functions under the current filters.</div>`}
            </div>
          </div>
        </div>`;
    }

    function renderGroupDetail(group) {
      const topFns = group.childrenVisible.filter((fn) => fn.isRemaining).slice(0, 18);
      elements.detailContent.innerHTML = `
        <div class="detail-title-row">
          <h2 class="detail-title">${escapeHtml(group.name)}</h2>
          <div class="detail-subtitle">${escapeHtml(group.path || "(no PDB path)")}</div>
        </div>
        <div class="detail-tags">
          <span class="chip"><span class="dot" style="background:${BUCKET_COLORS[group.dominantBucket]}"></span>${escapeHtml(group.dominantBucket)}</span>
          <span class="chip">${formatPercent(group.progressBytes, 1)} matched bytes</span>
          <span class="chip">${formatNumber(group.remainingCount)} remaining</span>
          ${group.blockerCount ? `<span class="chip">${formatNumber(group.blockerCount)} blockers</span>` : ""}
          ${group.customFlagsCount ? `<span class="chip">${formatNumber(group.customFlagsCount)} custom flags</span>` : ""}
        </div>
        <div class="detail-grid">
          <div class="detail-block"><div class="detail-label">Functions</div><div class="detail-value">${formatNumber(group.functionCount)}</div></div>
          <div class="detail-block"><div class="detail-label">Remaining bytes</div><div class="detail-value">${formatBytes(group.remainingBytes)}</div></div>
          <div class="detail-block"><div class="detail-label">Matched bytes</div><div class="detail-value">${formatBytes(group.matchedBytes)}</div></div>
          <div class="detail-block"><div class="detail-label">Bucket mix</div><div class="detail-value">${BUCKET_ORDER.map((bucket) => `${bucket} ${formatNumber(group.bucketCounts[bucket] || 0)}`).join(" · ")}</div></div>
        </div>
        <div class="section-label">largest remaining functions in this file</div>
        <div class="mini-list">
          ${topFns.map((fn) => `
            <button class="function-link ${state.selected && state.selected.type === "function" && state.selected.va === fn.va ? "active" : ""}" data-select-va="${escapeHtml(fn.va)}">
              <div class="mini-title"><span class="mono">${escapeHtml(fn.va)}</span> ${escapeHtml(fn.name)}</div>
              <div class="list-meta">${formatBytes(fn.sizeBytes)} · ${formatNumber(fn.asmLines)} asm · ${escapeHtml(fn.bucket)}${fn.sourceBlocker ? ` · ${escapeHtml(fn.sourceBlocker)}` : fn.sourceNext ? ` · next ${escapeHtml(fn.sourceNext)}` : ""}</div>
            </button>
          `).join("") || `<div class="inline-note">No remaining functions in this file under the current filters.</div>`}
        </div>`;
    }

    function renderFunctionDetail(fn) {
      const sourcePaths = sourcePathsForFunction(fn);
      const notes = [
        ["status", fn.sourceStatus],
        ["blocker", fn.sourceBlocker],
        ["next", fn.sourceNext],
        ["note", fn.sourceNote],
        ["why", fn.sourceWhy],
        ["risk", fn.sourceRisk],
        ["class", fn.sourceClass],
        ["flags", fn.sourceFlagsNote],
      ].filter((entry) => entry[1]);

      const actions = [];
      if (sourcePaths[0]) {
        actions.push(`<a class="button" href="${escapeHtml(repoUrl(sourcePaths[0]))}" target="_blank" rel="noopener">open source</a>`);
      }
      actions.push(`<a class="button" href="${escapeHtml(repoUrl(packetPathForFunction(fn)))}" target="_blank" rel="noopener">open packet</a>`);
      if (fn.customFlagsPath) {
        actions.push(`<a class="button" href="${escapeHtml(repoUrl(fn.customFlagsPath))}" target="_blank" rel="noopener">open flags</a>`);
      }
      actions.push(`<button class="button" data-select-group="${escapeHtml(fn.groupName)}">inspect file</button>`);
      if (!state.zoomGroup || state.zoomGroup !== fn.groupName) {
        actions.push(`<button class="button active" data-focus-function="${escapeHtml(fn.va)}">zoom to file</button>`);
      }

      elements.detailContent.innerHTML = `
        <div class="detail-title-row">
          <h2 class="detail-title">${escapeHtml(fn.name)}</h2>
          <div class="detail-subtitle"><span class="mono">${escapeHtml(fn.va)}</span> · ${escapeHtml(fn.groupName)}</div>
        </div>
        <div class="detail-tags">
          <span class="chip"><span class="dot" style="background:${BUCKET_COLORS[fn.bucket]}"></span>${escapeHtml(fn.bucket)}</span>
          ${fn.bucket === "accepted_drift" ? `<span class="chip">accepted drift</span>` : (fn.isRemaining ? `<span class="chip">remaining</span>` : `<span class="chip">matched</span>`)}
          ${fn.hasBlocker ? `<span class="chip">blocker</span>` : ""}
          ${fn.usesCustomFlags ? `<span class="chip">custom flags</span>` : ""}
        </div>
        <div class="detail-grid">
          <div class="detail-block"><div class="detail-label">Size</div><div class="detail-value">${formatBytes(fn.sizeBytes)}</div></div>
          <div class="detail-block"><div class="detail-label">Asm lines</div><div class="detail-value">${formatNumber(fn.asmLines)}</div></div>
          <div class="detail-block"><div class="detail-label">Edit diff</div><div class="detail-value">${formatPercent(fn.editDiffPercent ?? fn.diffPercent ?? 0, 4)} · ${formatNumber(fn.editDiffBytes ?? fn.diffBytes ?? 0)} bytes</div></div>
          <div class="detail-block"><div class="detail-label">Positional diff</div><div class="detail-value">${formatPercent(fn.positionalDiffPercent ?? fn.diffPercent ?? 0, 4)} · ${formatNumber(fn.positionalDiffBytes ?? fn.diffBytes ?? 0)} / ${formatNumber(fn.positionalDiffSpans ?? fn.diffSpans ?? 0)} spans</div></div>
          <div class="detail-block"><div class="detail-label">Edit ins/del/repl</div><div class="detail-value">${formatNumber(fn.editInsertBytes || 0)} / ${formatNumber(fn.editDeleteBytes || 0)} / ${formatNumber(fn.editReplaceBytes || 0)}</div></div>
          <div class="detail-block"><div class="detail-label">First mismatch</div><div class="detail-value">${escapeHtml(fn.firstMismatchOffset || "-")}${fn.likelyShiftedAlignment ? " · shifted" : ""}</div></div>
          <div class="detail-block"><div class="detail-label">Comment lines</div><div class="detail-value">${formatNumber(fn.sourceCommentLines || 0)}</div></div>
          <div class="detail-block"><div class="detail-label">Calling convention</div><div class="detail-value">${escapeHtml(fn.callingConvention || "?")}</div></div>
          <div class="detail-block"><div class="detail-label">Remaining rank</div><div class="detail-value">${fn.isRemaining ? `#${formatNumber(fn.remainingSizeRank || 0)}` : "done"}</div></div>
        </div>
        <div class="actions">${actions.join("")}</div>
        ${notes.length ? `
          <div>
            <div class="section-label">Notes</div>
            <div class="mini-list">
              ${notes.map(([label, value]) => `<div class="mini-row"><div class="note-label">${escapeHtml(label)}</div><div>${escapeHtml(value)}</div></div>`).join("")}
            </div>
          </div>` : ""}
        <div class="split">
          <div>
            <div class="section-label">Source preview</div>
            <div class="code-path">${escapeHtml(sourcePaths[0] || "No source file in src/")}</div>
            <pre>${escapeHtml(fn.sourcePreview || "No source available for this function yet.")}</pre>
          </div>
          <div>
            <div class="section-label">Paths</div>
            <div class="mini-list">
              <div class="mini-row"><div class="note-label">packet</div><div>${escapeHtml(packetPathForFunction(fn))}</div></div>
              <div class="mini-row"><div class="note-label">source</div><div>${escapeHtml(sourcePaths.join(" | ") || "Unclaimed in src/")}</div></div>
              ${fn.customFlagsPath ? `<div class="mini-row"><div class="note-label">flags</div><div>${escapeHtml(fn.customFlagsPath)}</div></div>` : ""}
            </div>
          </div>
        </div>`;
    }

    function renderDetail() {
      if (!state.selected) {
        renderOverviewDetail();
        return;
      }
      if (state.selected.type === "group") {
        const group = groupByNameVisible(state.selected.name);
        if (!group) {
          state.selected = null;
          renderOverviewDetail();
          return;
        }
        renderGroupDetail(group);
        return;
      }
      const fn = derived.visibleFns.find((entry) => entry.va === state.selected.va);
      if (!fn) {
        state.selected = null;
        renderOverviewDetail();
        return;
      }
      renderFunctionDetail(fn);
    }

    function fitCanvasHeight() {
      const topHeight = elements.top.getBoundingClientRect().height;
      const target = Math.max(460, Math.floor(window.innerHeight - topHeight - 20));
      elements.canvasWrap.style.height = `${target}px`;
    }

    function render() {
      saveState();
      derived = deriveData();
      fitCanvasHeight();
      renderTopStats();
      renderControls();
      renderDetail();
      renderTreemap();
    }

    document.addEventListener("click", (event) => {
      const viewNode = event.target.closest("[data-set-view]");
      if (viewNode) {
        state.viewMode = viewNode.getAttribute("data-set-view");
        state.zoomGroup = null;
        state.selected = null;
        render();
        return;
      }

      const metricNode = event.target.closest("[data-set-metric]");
      if (metricNode) {
        state.metric = metricNode.getAttribute("data-set-metric");
        render();
        return;
      }

      const colorNode = event.target.closest("[data-set-color]");
      if (colorNode) {
        state.colorMode = colorNode.getAttribute("data-set-color");
        render();
        return;
      }

      const toggleNode = event.target.closest("[data-toggle]");
      if (toggleNode) {
        const key = toggleNode.getAttribute("data-toggle");
        state[key] = !state[key];
        render();
        return;
      }

      const bucketNode = event.target.closest("[data-bucket-toggle]");
      if (bucketNode) {
        const bucket = bucketNode.getAttribute("data-bucket-toggle");
        state.buckets[bucket] = !state.buckets[bucket];
        if (!Object.values(state.buckets).some(Boolean)) {
          state.buckets[bucket] = true;
        }
        render();
        return;
      }

      const actionNode = event.target.closest("[data-action]");
      if (actionNode) {
        const action = actionNode.getAttribute("data-action");
        if (action === "zoom-out") {
          state.zoomGroup = null;
          state.selected = null;
          render();
          return;
        }
        if (action === "reset") {
          state.query = "";
          state.viewMode = "files";
          state.metric = "bytes";
          state.colorMode = "status";
          state.onlyRemaining = false;
          state.onlyBlockers = false;
          state.buckets = { ...defaultBuckets };
          state.zoomGroup = null;
          state.selected = null;
          render();
          return;
        }
      }

      const groupNode = event.target.closest("[data-select-group]");
      if (groupNode) {
        const name = groupNode.getAttribute("data-select-group");
        state.selected = { type: "group", name };
        render();
        return;
      }

      const zoomGroupNode = event.target.closest("[data-zoom-group]");
      if (zoomGroupNode) {
        const name = zoomGroupNode.getAttribute("data-zoom-group");
        state.zoomGroup = name;
        state.selected = { type: "group", name };
        render();
        return;
      }

      const fnNode = event.target.closest("[data-select-va]");
      if (fnNode) {
        const va = fnNode.getAttribute("data-select-va");
        state.selected = { type: "function", va };
        render();
        return;
      }

      const focusNode = event.target.closest("[data-focus-function]");
      if (focusNode) {
        const va = focusNode.getAttribute("data-focus-function");
        const fn = FUNCTION_BY_VA.get(va);
        if (fn) {
          state.zoomGroup = fn.groupName;
          state.selected = { type: "function", va };
          render();
        }
      }
    });

    elements.searchInput.addEventListener("input", (event) => {
      state.query = event.target.value;
      render();
    });

    function schedulePointerUpdate(pointer) {
      queuedPointer = pointer;
      if (hoverFramePending) {
        return;
      }
      hoverFramePending = true;
      requestAnimationFrame(() => {
        hoverFramePending = false;
        if (!queuedPointer) {
          return;
        }
        const region = hitRegionAt(queuedPointer.x, queuedPointer.y);
        if (region !== hoveredRegion) {
          updateTooltip(queuedPointer.event, region);
          renderHoverOverlay();
        } else if (region) {
          updateTooltip(queuedPointer.event, region);
        }
      });
    }

    elements.canvas.addEventListener("mousemove", (event) => {
      schedulePointerUpdate({ x: event.offsetX, y: event.offsetY, event });
    });

    elements.canvas.addEventListener("mouseleave", () => {
      queuedPointer = null;
      hoveredRegion = null;
      elements.tooltip.classList.remove("visible");
      renderHoverOverlay();
    });

    elements.canvas.addEventListener("click", (event) => {
      const rect = elements.canvas.getBoundingClientRect();
      const region = hitRegionAt(event.clientX - rect.left, event.clientY - rect.top);
      if (!region) {
        state.selected = null;
        render();
        return;
      }

      if (!state.zoomGroup && state.viewMode === "files") {
        state.zoomGroup = region.action.group;
        state.selected = { type: "group", name: region.action.group };
        render();
        return;
      }

      if (region.action.type === "select-function") {
        state.selected = { type: "function", va: region.action.va };
        render();
      }
    });

    elements.canvas.addEventListener("contextmenu", (event) => {
      event.preventDefault();
      if (state.zoomGroup) {
        state.zoomGroup = null;
        state.selected = null;
        render();
      }
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && state.zoomGroup) {
        state.zoomGroup = null;
        state.selected = null;
        render();
      }
    });

    window.addEventListener("resize", () => {
      fitCanvasHeight();
      renderTreemap();
    });

    render();
  </script>
</body>
</html>
